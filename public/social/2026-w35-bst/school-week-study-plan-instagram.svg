<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Study around a school week</title>
  <desc id="desc">Instagram graphic showing how school-based BCBA candidates can use short practice, full mock checkpoints, and saved questions.</desc>
  <rect width="1080" height="1350" fill="#0f2f29"/>
  <rect x="70" y="70" width="940" height="1210" fill="#fffaf0"/>
  <text x="115" y="155" fill="#21463b" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Behavior Study Tools</text>
  <text x="115" y="255" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">Study around</text>
  <text x="115" y="340" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">a school week.</text>
  <g transform="translate(115 440)">
    <rect width="850" height="126" fill="#ffffff" stroke="#d8c7a6" stroke-width="3"/>
    <text x="34" y="52" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="800">Busy day</text>
    <text x="34" y="94" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="28">Short focused practice</text>
    <rect y="165" width="850" height="126" fill="#ffffff" stroke="#d8c7a6" stroke-width="3"/>
    <text x="34" y="217" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="800">Protected block</text>
    <text x="34" y="259" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="28">Full mock checkpoint</text>
    <rect y="330" width="850" height="126" fill="#ffffff" stroke="#d8c7a6" stroke-width="3"/>
    <text x="34" y="382" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="800">Return later</text>
    <text x="34" y="424" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="28">Domain results and saved questions</text>
  </g>
  <rect x="115" y="1040" width="850" height="118" fill="#b8842d"/>
  <text x="155" y="1112" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">Keep the next action visible.</text>
  <text x="115" y="1220" fill="#21463b" font-family="Arial, Helvetica, sans-serif" font-size="29">Browser-based BCBA practice, mock exams, and planning.</text>
</svg>
