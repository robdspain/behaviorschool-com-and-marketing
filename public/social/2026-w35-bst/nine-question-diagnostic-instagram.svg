<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Nine-question BCBA diagnostic</title>
  <desc id="desc">Instagram carousel cover for a nine-question BCBA diagnostic that points to the next study action.</desc>
  <rect width="1080" height="1350" fill="#fbf7ef"/>
  <rect x="70" y="70" width="940" height="1210" fill="#ffffff" stroke="#21463b" stroke-width="4"/>
  <text x="110" y="150" fill="#21463b" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Behavior Study Tools</text>
  <text x="110" y="250" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="800">Before another</text>
  <text x="110" y="336" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="800">broad review</text>
  <rect x="110" y="400" width="860" height="170" fill="#21463b"/>
  <text x="150" y="472" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800">Take 9 questions.</text>
  <text x="150" y="526" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="33">One from each content area.</text>
  <g transform="translate(110 650)">
    <circle cx="44" cy="44" r="44" fill="#b8842d"/>
    <text x="32" y="58" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800">1</text>
    <text x="120" y="38" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Answer the diagnostic</text>
    <text x="120" y="82" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="27">Start in the browser without payment.</text>
    <circle cx="44" cy="204" r="44" fill="#b8842d"/>
    <text x="32" y="218" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800">2</text>
    <text x="120" y="198" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Check the signal</text>
    <text x="120" y="242" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="27">See which area needs attention.</text>
    <circle cx="44" cy="364" r="44" fill="#b8842d"/>
    <text x="32" y="378" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800">3</text>
    <text x="120" y="358" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Choose the next block</text>
    <text x="120" y="402" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="27">Focused mini mock or full checkpoint.</text>
  </g>
  <text x="110" y="1210" fill="#21463b" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Make the next study task specific.</text>
</svg>
