<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Behavior Study Tools diagnostic next step</title>
  <desc id="desc">Facebook graphic showing a short BCBA diagnostic leading to a focused next study block.</desc>
  <rect width="1200" height="630" fill="#f6f0e4"/>
  <rect x="56" y="56" width="1088" height="518" rx="0" fill="#fffdf8" stroke="#21463b" stroke-width="3"/>
  <text x="92" y="118" fill="#21463b" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Behavior Study Tools</text>
  <text x="92" y="190" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">Start with a short</text>
  <text x="92" y="258" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">diagnostic.</text>
  <text x="92" y="334" fill="#2f4f46" font-family="Arial, Helvetica, sans-serif" font-size="31">One question from each BCBA 6th Edition area.</text>
  <text x="92" y="380" fill="#2f4f46" font-family="Arial, Helvetica, sans-serif" font-size="31">Use the result to choose the next study block.</text>
  <g transform="translate(90 438)">
    <rect width="210" height="74" fill="#21463b"/>
    <text x="32" y="47" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Practice</text>
    <path d="M235 37h90" stroke="#b8842d" stroke-width="8" stroke-linecap="square"/>
    <path d="M314 20l30 17-30 17z" fill="#b8842d"/>
    <rect x="372" width="270" height="74" fill="#efe4d1" stroke="#b8842d" stroke-width="3"/>
    <text x="402" y="47" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Domain signal</text>
    <path d="M670 37h90" stroke="#b8842d" stroke-width="8" stroke-linecap="square"/>
    <path d="M749 20l30 17-30 17z" fill="#b8842d"/>
    <rect x="808" width="238" height="74" fill="#21463b"/>
    <text x="843" y="47" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Next task</text>
  </g>
  <text x="92" y="552" fill="#5a5144" font-family="Arial, Helvetica, sans-serif" font-size="23">Free browser-based starting point. No account required to begin.</text>
</svg>
