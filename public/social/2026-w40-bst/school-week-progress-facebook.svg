<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">School week study progress</title>
  <desc id="desc">Facebook graphic showing short practice, full mock, and progress report options for a school week.</desc>
  <rect width="1200" height="630" fill="#f7f3ea"/>
  <rect x="56" y="56" width="1088" height="518" fill="#fffdf7" stroke="#123628" stroke-width="4"/>
  <text x="96" y="126" fill="#1f4d3f" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Behavior Study Tools</text>
  <text x="96" y="206" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800">Make study visible</text>
  <text x="96" y="274" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800">during a school week.</text>
  <g transform="translate(96 350)">
    <rect width="302" height="116" fill="#1f4d3f"/>
    <text x="30" y="55" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">Crowded day</text>
    <text x="30" y="88" fill="#dbece7" font-family="Arial, Helvetica, sans-serif" font-size="24">short practice</text>
    <rect x="364" width="302" height="116" fill="#f1e1c5" stroke="#c8952d" stroke-width="4"/>
    <text x="394" y="55" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">Protected block</text>
    <text x="394" y="88" fill="#3d4a46" font-family="Arial, Helvetica, sans-serif" font-size="24">full mock</text>
    <rect x="728" width="302" height="116" fill="#1f4d3f"/>
    <text x="758" y="55" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">Review</text>
    <text x="758" y="88" fill="#dbece7" font-family="Arial, Helvetica, sans-serif" font-size="24">progress pattern</text>
  </g>
  <text x="96" y="526" fill="#3d4a46" font-family="Arial, Helvetica, sans-serif" font-size="30">Choose the next task from the pattern.</text>
</svg>
