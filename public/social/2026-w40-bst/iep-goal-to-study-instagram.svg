<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Pick the tool for the school problem</title>
  <desc id="desc">Instagram graphic comparing the IEP goal readiness check and Behavior Study Tools exam practice.</desc>
  <rect width="1080" height="1350" fill="#f8f7f3"/>
  <rect x="70" y="70" width="940" height="1210" fill="#fffdf7" stroke="#123628" stroke-width="4"/>
  <text x="112" y="152" fill="#1f4d3f" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Behavior School</text>
  <text x="112" y="258" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800">Pick the tool</text>
  <text x="112" y="340" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800">for the</text>
  <text x="112" y="422" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800">problem.</text>
  <g transform="translate(118 548)">
    <rect width="844" height="178" fill="#1f4d3f"/>
    <text x="38" y="74" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800">IEP goal question</text>
    <text x="38" y="124" fill="#dbece7" font-family="Arial, Helvetica, sans-serif" font-size="30">Use the readiness check</text>
    <rect y="244" width="844" height="178" fill="#f1e1c5" stroke="#c8952d" stroke-width="4"/>
    <text x="38" y="318" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800">BCBA exam practice</text>
    <text x="38" y="368" fill="#3d4a46" font-family="Arial, Helvetica, sans-serif" font-size="30">Use diagnostic or mock results</text>
  </g>
  <text x="112" y="1098" fill="#1f4d3f" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">Different tool.</text>
  <text x="112" y="1156" fill="#1f4d3f" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">One visible next step.</text>
</svg>
