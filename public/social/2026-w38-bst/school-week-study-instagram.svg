<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">School week BCBA study rhythm</title>
  <desc id="desc">Instagram carousel cover showing short practice, full mock, and progress report options for school-week study.</desc>
  <rect width="1080" height="1350" fill="#fbf6ed"/>
  <rect x="70" y="70" width="940" height="1210" fill="#ffffff" stroke="#1f4d3f" stroke-width="4"/>
  <text x="112" y="150" fill="#1f4d3f" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Behavior Study Tools</text>
  <text x="112" y="256" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">Build a study</text>
  <text x="112" y="340" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">rhythm that</text>
  <text x="112" y="424" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">fits school.</text>
  <g transform="translate(120 560)">
    <rect width="840" height="118" fill="#1f4d3f"/>
    <text x="36" y="73" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800">Crowded day: short practice</text>
    <rect y="164" width="840" height="118" fill="#f1e1c5" stroke="#c8952d" stroke-width="3"/>
    <text x="36" y="237" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800">Protected block: full mock</text>
    <rect y="328" width="840" height="118" fill="#1f4d3f"/>
    <text x="36" y="401" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800">Review: report progress</text>
  </g>
  <text x="112" y="1104" fill="#1f4d3f" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">Keep the next action visible.</text>
  <text x="112" y="1190" fill="#5b6a63" font-family="Arial, Helvetica, sans-serif" font-size="30">Practice, review, readiness, and reports.</text>
</svg>
