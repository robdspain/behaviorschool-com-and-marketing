<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Free full mock review</title>
  <desc id="desc">Facebook graphic showing a free full BCBA mock exam leading to domain review and next practice.</desc>
  <rect width="1200" height="630" fill="#f6efe2"/>
  <rect x="60" y="58" width="1080" height="514" fill="#fffdf7" stroke="#1f4d3f" stroke-width="4"/>
  <text x="96" y="122" fill="#1f4d3f" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Behavior Study Tools</text>
  <text x="96" y="204" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">A full mock is</text>
  <text x="96" y="274" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">a checkpoint.</text>
  <g transform="translate(96 344)">
    <rect width="300" height="96" fill="#1f4d3f"/>
    <text x="28" y="59" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">185 questions</text>
    <rect x="338" width="300" height="96" fill="#f1e1c5" stroke="#c8952d" stroke-width="3"/>
    <text x="366" y="59" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">Domain breakdown</text>
    <rect x="676" width="300" height="96" fill="#1f4d3f"/>
    <text x="704" y="43" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800">One follow-up</text>
    <text x="704" y="72" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800">practice block</text>
  </g>
  <text x="96" y="514" fill="#2f4f46" font-family="Arial, Helvetica, sans-serif" font-size="30">Finish the mock, then decide what belongs next.</text>
</svg>
