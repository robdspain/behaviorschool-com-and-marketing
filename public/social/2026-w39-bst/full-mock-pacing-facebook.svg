<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Free full mock pacing checkpoint</title>
  <desc id="desc">Facebook graphic showing a free 185-question mock as a pacing and domain checkpoint.</desc>
  <rect width="1200" height="630" fill="#f6efe2"/>
  <rect x="58" y="58" width="1084" height="514" fill="#ffffff" stroke="#1f4d3f" stroke-width="4"/>
  <text x="96" y="124" fill="#1f4d3f" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Behavior Study Tools</text>
  <text x="96" y="210" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800">Practice the pace,</text>
  <text x="96" y="278" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800">then review the pattern.</text>
  <g transform="translate(96 350)">
    <rect width="252" height="96" fill="#1f4d3f"/>
    <text x="36" y="60" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">185 questions</text>
    <rect x="310" width="252" height="96" fill="#f1e1c5" stroke="#c8952d" stroke-width="3"/>
    <text x="348" y="60" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">Timer</text>
    <rect x="620" width="252" height="96" fill="#1f4d3f"/>
    <text x="656" y="60" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">Domain results</text>
  </g>
  <text x="96" y="520" fill="#3d4a46" font-family="Arial, Helvetica, sans-serif" font-size="30">A free account is enough to start the timed mock.</text>
</svg>
