<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Behavior Study Tools rationale review YouTube Shorts cover</title>
  <desc id="desc">A vertical YouTube Shorts cover about studying the rationale after a BCBA practice question.</desc>
  <rect width="1080" height="1920" fill="#0B3528"/>
  <rect x="88" y="112" width="904" height="1696" rx="42" fill="#FFFEFA"/>
  <text x="142" y="230" fill="#1F4D3F" font-family="Arial, sans-serif" font-size="38" font-weight="700">Behavior Study Tools</text>
  <text x="142" y="430" fill="#171F1D" font-family="Georgia, serif" font-size="96" font-weight="700">Do not stop</text>
  <text x="142" y="540" fill="#171F1D" font-family="Georgia, serif" font-size="96" font-weight="700">at the answer</text>
