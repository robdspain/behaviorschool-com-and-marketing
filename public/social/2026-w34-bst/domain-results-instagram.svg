  <text x="224" y="864" fill="#171F1D" font-family="Arial, sans-serif" font-size="34">Practice</text>
  <circle cx="184" cy="932" r="16" fill="#E4B63D"/>
  <text x="224" y="944" fill="#171F1D" font-family="Arial, sans-serif" font-size="34">Review domain results</text>
  <circle cx="184" cy="1012" r="16" fill="#E4B63D"/>
  <text x="224" y="1024" fill="#171F1D" font-family="Arial, sans-serif" font-size="34">Choose the next block</text>
  <rect x="118" y="1140" width="500" height="72" rx="14" fill="#E4B63D"/>
  <text x="154" y="1188" fill="#0B3528" font-family="Arial, sans-serif" font-size="30" font-weight="700">Start free practice</text>
</svg>
