<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Before your next mock Behavior Study Tools Instagram cover</title>
  <desc id="desc">An Instagram graphic prompting BCBA candidates to check their weakest domain before the next mock exam.</desc>
  <rect width="1080" height="1350" fill="#FBFAF6"/>
  <rect x="70" y="70" width="940" height="1210" rx="34" fill="#0B3528"/>
  <text x="118" y="166" fill="#E4B63D" font-family="Arial, sans-serif" font-size="34" font-weight="700">Behavior Study Tools</text>
  <text x="118" y="310" fill="#FFFEFA" font-family="Georgia, serif" font-size="86" font-weight="700">Before your</text>
  <text x="118" y="410" fill="#FFFEFA" font-family="Georgia, serif" font-size="86" font-weight="700">next mock</text>
  <text x="118" y="520" fill="#FFFEFA" font-family="Arial, sans-serif" font-size="44">Check the domain that</text>
  <text x="118" y="578" fill="#FFFEFA" font-family="Arial, sans-serif" font-size="44">is costing you points.</text>
