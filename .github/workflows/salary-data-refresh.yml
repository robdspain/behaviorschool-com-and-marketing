name: Refresh Salary Benchmarks

# Q10 policy: update quarterly if /school-bcba/salary-by-state is getting traffic.
# Scheduled runs only proceed when the GitHub Actions variable
# SALARY_PAGE_HAS_TRAFFIC is the string "true" (set it from GSC or Ahrefs).
# workflow_dispatch always runs so a refresh can be triggered by hand.

on:
  schedule:
    # 00:05 UTC on the 1st of January, April, July, and October
    - cron: "5 0 1 1,4,7,10 *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SALARY_PAGE_HAS_TRAFFIC == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh salary data from sheet
        env:
          SALARY_DATA_URL: ${{ vars.SALARY_DATA_URL }}
        run: |
          node --version
          node scripts/update-salary-data.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [[ -n $(git status --porcelain public/data/salary-benchmarks.json) ]]; then
            year=$(date +%Y)
            git add public/data/salary-benchmarks.json
            git commit -m "chore(data): refresh salary benchmarks for ${year}"
            git push
          else
            echo "No changes to commit."
          fi
